<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5f99">
  <title>인천광역시서부교육지원청 스마트 청사안내</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">인천광역시서부교육지원청</p>
        <h1>스마트 청사안내</h1>
      </div>
      <div class="status-pill">모바일 안내</div>
    </header>

    <main id="app">
      <section id="homeView" class="view active">
        <div class="hero">
          <h2>무엇을 찾고 계신가요?</h2>
          <p>업무명이나 궁금한 내용을 검색하면 담당부서와 전화번호를 안내합니다.</p>
          <div class="search-wrap">
            <span>🔎</span>
            <input id="homeSearch" type="search" placeholder="예: 전학, 학원, 학교폭력, 교육급여">
            <button id="homeSearchBtn">검색</button>
          </div>
        </div>

        <div class="quick-grid">
          <button class="quick-card" data-go="serviceView">
            <span class="quick-icon">🔎</span>
            <strong>업무로 담당부서 찾기</strong>
            <small>업무명·키워드 검색</small>
          </button>
          <button class="quick-card" data-go="floorView">
            <span class="quick-icon">🏢</span>
            <strong>층별 청사 안내</strong>
            <small>층별 부서·공간 안내</small>
          </button>
          <button class="quick-card" data-go="contactView">
            <span class="quick-icon">☎️</span>
            <strong>부서 전화번호 찾기</strong>
            <small>대표번호·센터 연락처</small>
          </button>
          <button class="quick-card" data-go="smartView">
            <span class="quick-icon">💬</span>
            <strong>문장으로 찾아보기</strong>
            <small>자연스러운 문장으로 검색</small>
          </button>
        </div>

        <section class="info-card">
          <strong>대표전화 032-560-6600</strong>
          <span>대표팩스 032-568-8160</span>
        </section>
      </section>

      <section id="serviceView" class="view">
        <div class="section-head">
          <button class="back-btn" data-go="homeView">←</button>
          <div><h2>업무로 담당부서 찾기</h2><p>검색용 키워드는 화면에 표시하지 않습니다.</p></div>
        </div>
        <div class="search-wrap compact">
          <span>🔎</span>
          <input id="serviceSearch" type="search" placeholder="업무명, 담당부서, 키워드 검색">
        </div>
        <div id="categoryChips" class="chips"></div>
        <div id="serviceCount" class="result-count"></div>
        <div id="serviceResults" class="card-list"></div>
      </section>

      <section id="floorView" class="view">
        <div class="section-head">
          <button class="back-btn" data-go="homeView">←</button>
          <div><h2>층별 청사 안내</h2><p>부서와 주요 공간을 층별로 확인하세요.</p></div>
        </div>
        <div id="floorResults" class="floor-list"></div>
      </section>

      <section id="contactView" class="view">
        <div class="section-head">
          <button class="back-btn" data-go="homeView">←</button>
          <div><h2>부서 전화번호 찾기</h2><p>전화번호를 누르면 바로 연결할 수 있습니다.</p></div>
        </div>
        <div class="search-wrap compact">
          <span>🔎</span>
          <input id="contactSearch" type="search" placeholder="부서·공간 검색">
        </div>
        <div id="contactResults" class="card-list"></div>
      </section>

      <section id="smartView" class="view">
        <div class="section-head">
          <button class="back-btn" data-go="homeView">←</button>
          <div><h2>문장으로 찾아보기</h2><p>현재는 공개 DB를 이용한 스마트 검색입니다.</p></div>
        </div>
        <div class="smart-box">
          <label for="smartSearch">궁금한 내용을 편하게 입력하세요.</label>
          <textarea id="smartSearch" rows="3" placeholder="예: 아이가 중학교를 옮기려고 하는데 어디에 전화하면 되나요?"></textarea>
          <button id="smartSearchBtn" class="primary-btn">안내 찾기</button>
        </div>
        <div id="smartResults" class="card-list"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-go="homeView" class="nav-btn active">🏠<span>홈</span></button>
      <button data-go="serviceView" class="nav-btn">🔎<span>업무검색</span></button>
      <button data-go="floorView" class="nav-btn">🏢<span>층별안내</span></button>
      <button data-go="contactView" class="nav-btn">☎️<span>부서전화</span></button>
      <button data-go="smartView" class="nav-btn">💬<span>스마트검색</span></button>
    </nav>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
